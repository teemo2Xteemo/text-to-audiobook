services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_PATH: ${STORAGE_PATH:-/data/storage}
      OUTPUT_BITRATE_KBPS: ${OUTPUT_BITRATE_KBPS:-128}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2000000}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-fake}
      TTS_PROVIDER: ${TTS_PROVIDER:-fake}
      TTS_DEFAULT_VOICE_BY_LANGUAGE: ${TTS_DEFAULT_VOICE_BY_LANGUAGE:-}
      NLLB_MODEL_ID: ${NLLB_MODEL_ID:-facebook/nllb-200-distilled-600M}
      LANGUAGE_DETECT_MIN_CONFIDENCE: ${LANGUAGE_DETECT_MIN_CONFIDENCE:-0.5}
    volumes:
      - ./storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_PATH: ${STORAGE_PATH:-/data/storage}
      OUTPUT_BITRATE_KBPS: ${OUTPUT_BITRATE_KBPS:-128}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-fake}
      TTS_PROVIDER: ${TTS_PROVIDER:-fake}
      TTS_DEFAULT_VOICE_BY_LANGUAGE: ${TTS_DEFAULT_VOICE_BY_LANGUAGE:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      NLLB_MODEL_ID: ${NLLB_MODEL_ID:-facebook/nllb-200-distilled-600M}
      LANGUAGE_DETECT_MIN_CONFIDENCE: ${LANGUAGE_DETECT_MIN_CONFIDENCE:-0.5}
      HF_HOME: /data/huggingface
    volumes:
      - ./storage:/data/storage
      - huggingface-cache:/data/huggingface
    depends_on:
      redis:
        condition: service_healthy
    # Single RQ process (one job at a time). Scale with replicas later.
    command:
      [
        "rq",
        "worker",
        "--url",
        "redis://redis:6379/0",
        "jobs",
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_DEFAULT_SOURCE_LANGUAGE: ${VITE_DEFAULT_SOURCE_LANGUAGE:-auto}
        VITE_DEFAULT_TARGET_LANGUAGE: ${VITE_DEFAULT_TARGET_LANGUAGE:-}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  huggingface-cache:
