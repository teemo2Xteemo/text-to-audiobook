# CPU-only MVP (ADR 0009). Do not add `runtime: nvidia` or GPU reservations.
# Default providers are fake/fake so compose boots offline. For the AC demo,
# set TRANSLATION_PROVIDER=nllb and TTS_PROVIDER=edge in `.env` and rebuild.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_PATH: ${STORAGE_PATH:-/data/storage}
      OUTPUT_BITRATE_KBPS: ${OUTPUT_BITRATE_KBPS:-128}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2000000}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-fake}
      TTS_PROVIDER: ${TTS_PROVIDER:-fake}
      TTS_DEFAULT_VOICE_BY_LANGUAGE: ${TTS_DEFAULT_VOICE_BY_LANGUAGE:-}
      NLLB_MODEL_ID: ${NLLB_MODEL_ID:-facebook/nllb-200-distilled-600M}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TRANSLATION_MODEL: ${OLLAMA_TRANSLATION_MODEL:-translategemma:4b}
      OLLAMA_HTTP_TIMEOUT_SECONDS: ${OLLAMA_HTTP_TIMEOUT_SECONDS:-120}
      LANGUAGE_DETECT_MIN_CONFIDENCE: ${LANGUAGE_DETECT_MIN_CONFIDENCE:-0.5}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-1}
      RQ_JOB_TIMEOUT_SECONDS: ${RQ_JOB_TIMEOUT_SECONDS:-1800}
    volumes:
      - ./storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_PATH: ${STORAGE_PATH:-/data/storage}
      OUTPUT_BITRATE_KBPS: ${OUTPUT_BITRATE_KBPS:-128}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-fake}
      TTS_PROVIDER: ${TTS_PROVIDER:-fake}
      TTS_DEFAULT_VOICE_BY_LANGUAGE: ${TTS_DEFAULT_VOICE_BY_LANGUAGE:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      NLLB_MODEL_ID: ${NLLB_MODEL_ID:-facebook/nllb-200-distilled-600M}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_TRANSLATION_MODEL: ${OLLAMA_TRANSLATION_MODEL:-translategemma:4b}
      OLLAMA_HTTP_TIMEOUT_SECONDS: ${OLLAMA_HTTP_TIMEOUT_SECONDS:-120}
      LANGUAGE_DETECT_MIN_CONFIDENCE: ${LANGUAGE_DETECT_MIN_CONFIDENCE:-0.5}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-1}
      RQ_JOB_TIMEOUT_SECONDS: ${RQ_JOB_TIMEOUT_SECONDS:-1800}
      HF_HOME: /data/huggingface
    volumes:
      - ./storage:/data/storage
      - huggingface-cache:/data/huggingface
    depends_on:
      redis:
        condition: service_healthy
    # Recover non-terminal jobs from status.json, then consume the RQ queue.
    # Image ENTRYPOINT chowns STORAGE_PATH then drops to uid 1000 (app).
    command: ["python", "-m", "app.workers"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_DEFAULT_SOURCE_LANGUAGE: ${VITE_DEFAULT_SOURCE_LANGUAGE:-auto}
        VITE_DEFAULT_TARGET_LANGUAGE: ${VITE_DEFAULT_TARGET_LANGUAGE:-}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  huggingface-cache:
