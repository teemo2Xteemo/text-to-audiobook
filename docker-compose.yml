services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_PATH: ${STORAGE_PATH:-/data/storage}
      OUTPUT_BITRATE_KBPS: ${OUTPUT_BITRATE_KBPS:-128}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2000000}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-fake}
      TTS_PROVIDER: ${TTS_PROVIDER:-fake}
    volumes:
      - ./storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_PATH: ${STORAGE_PATH:-/data/storage}
      OUTPUT_BITRATE_KBPS: ${OUTPUT_BITRATE_KBPS:-128}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-fake}
      TTS_PROVIDER: ${TTS_PROVIDER:-fake}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    volumes:
      - ./storage:/data/storage
    depends_on:
      redis:
        condition: service_healthy
    # Single RQ process (one job at a time). Scale with replicas later.
    command:
      [
        "rq",
        "worker",
        "--url",
        "redis://redis:6379/0",
        "jobs",
      ]
