name: Feature / spec
description: Propose a new capability or a change to existing behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem & who it affects
      description: The user pain today, not the solution. Point to current code if known.
      placeholder: "As a reader with a GBK-encoded .txt, my upload fails with 'source text must be UTF-8'."
    validations:
      required: true
  # The label "Priority" and option texts are matched verbatim by .github/workflows/issue-labels.yml.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — blocks core use, do now
        - P1 — important, next milestone
        - P2 — nice to have
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Success looks like
      description: The observable result, and how we will know it worked (metric, user-visible behavior).
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / non-goals
      placeholder: |
        **In scope**
        -

        **Not in this issue**
        -
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed design (optional)
      description: API/config changes, affected ports and providers, UI. Must stay language-agnostic and behind provider ports.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable, user-observable checks. This is the definition of done.
      placeholder: "- [ ] POST /jobs accepts mode=narrate and returns job_id"
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Dependencies, risks, open questions
      placeholder: "Depends on #29. Changes chunking → old checkpoints unsafe to retry?"
